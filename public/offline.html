<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#13161d" />
  <title>Offline · Files</title>
  <style>
    :root { color-scheme: dark light; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; padding: 24px;
      background: #13161d; color: #e3e8ef;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased; text-align: center;
    }
    .wrap { max-width: 26rem; width: 100%; }
    .mark {
      width: 56px; height: 56px; margin: 0 auto 22px; border-radius: 16px;
      display: grid; place-items: center; font-weight: 900; font-size: 22px;
      color: #eaa93a; background: rgba(234,169,58,.15); border: 1px solid rgba(234,169,58,.4);
    }
    h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: -.01em; margin: 0 0 10px; }
    p { color: #a9b4c4; line-height: 1.6; margin: 0 0 26px; font-size: .95rem; }
    button {
      font: inherit; font-weight: 700; cursor: pointer;
      background: #eaa93a; color: #13161d; border: 0; border-radius: 10px;
      padding: 11px 22px; transition: opacity .15s;
    }
    button:hover { opacity: .9; }
    .foot {
      margin-top: 28px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: #55617a;
    }
    .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#f0726f; margin-right:7px; vertical-align:middle; }
    @media (prefers-color-scheme: light) {
      body { background: #f4f5f7; color: #131c2b; }
      p { color: #46536a; }
      .mark { color: #9c6a04; background: rgba(156,106,4,.12); border-color: rgba(156,106,4,.35); }
      button { background: #9c6a04; color: #fff; }
      .foot { color: #97a3b4; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark">F</div>
    <h1><span class="dot"></span>Kamu sedang offline</h1>
    <p>Sambungan internet terputus atau terlalu lambat. Cek koneksimu, lalu coba muat ulang halaman.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
    <div class="foot">Files</div>
  </div>
  <script>
    // begitu koneksi balik, otomatis muat ulang ke halaman asli
    window.addEventListener('online', function () { location.reload() })
  </script>
</body>
</html>
